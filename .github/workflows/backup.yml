# Weekly encrypted backup of the Supabase database, kept as a workflow artifact.
#
# The repo is public, so the dump is encrypted before upload; without the
# passphrase an artifact is unreadable. Setup and restore: docs/deploy.md.
#
# Needs repository secrets SUPABASE_DB_URL and BACKUP_PASSPHRASE, and the
# repository variable BACKUPS_ENABLED=true (so it stays off until configured).
name: Backup database

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        run: |
          supabase db dump --db-url "$SUPABASE_DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f data.sql --use-copy --data-only

      - name: Encrypt
        run: |
          tar czf backup.tar.gz roles.sql schema.sql data.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o backup.tar.gz.gpg backup.tar.gz
          rm roles.sql schema.sql data.sql backup.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
